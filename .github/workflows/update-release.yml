name: Update Manifest
on:
  # The manifest update lands as a PR, so the GitHub release is cut when that
  # PR merges rather than in the dispatch run. Tagging in the dispatch run
  # would point the tag at a commit that does not contain the manifest update.
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to be tagged in release'
        required: true

jobs:
  update-and-verify:
    name: Check Urls and Versions
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest-large
    env:
      SCOOP: 'C:\Scoop\user'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Persist the PAT so pushing the release branch uses the same
          # credential that opens the PR.
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      - name: Install Scoop
        run: |
          (New-Object System.Net.WebClient).DownloadFile('https://get.scoop.sh', 'scoop.ps1') 
          ./scoop.ps1 -RunAsAdmin
          echo "$env:SCOOP\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Update Manifest
        run: |
          .\scripts\updatever.ps1
      - name: Verify and update hashes
        run: |
          # Update hashes in case checksum isn't correctly updated
          .\scripts\checkhashes.ps1
      - name: Verify Urls
        run: |
          # First run for logging, second for error handling
          .\scripts\checkurls.ps1
          .\scripts\checkurls.ps1 6> results.txt
          $error_string = Select-String -Path results.txt -Pattern "error"
          if ($error_string -ne $null) {
              echo "URLS are misconfigured!"
              Exit 1
          }
      - name: Commit Changes
        run: |
          .\scripts\commit-release.ps1 -version $env:VERSION
        env:
          VERSION: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}

  # Runs on the merge of a manifest PR, so the tag lands on a commit that
  # actually contains the manifest update.
  release:
    if: >-
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'Update manifest to version ')
    runs-on: ubuntu-x64
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Create GitHub Release
        # The dispatch input is gone by now, so the version comes from the
        # commit subject commit-release.ps1 wrote ("Update manifest to version
        # <version>"). A squash merge appends " (#N)", which is stripped here.
        # The draft check is unchanged, just applied to the parsed version.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject=$(printf '%s' "$COMMIT_MESSAGE" | head -1)
          version=$(printf '%s' "$subject" | sed -E 's/^Update manifest to version ([^ ]+).*/\1/')
          if [ -z "$version" ] || [ "$version" = "$subject" ]; then
            echo "::error::Could not parse a version from: $subject"
            exit 1
          fi
          echo "Releasing $version"
          ARGS=()
          case "$version" in *draft*) ARGS+=(--prerelease) ;; esac
          gh release create "$version" --generate-notes "${ARGS[@]}"
